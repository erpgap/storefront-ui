# Lint, typecheck and unit tests on every push and pull request.
#
# The deploy workflows ran no tests at all, so the suite only ran when
# somebody remembered to run it. This gates merges on it instead.
name: Test

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Version from package.json's packageManager field.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # --frozen-lockfile so a drifting lockfile fails here rather than in a
      # deploy. --ignore-scripts skips the postinstall `nuxt prepare` (run as
      # its own step below) and husky.
      - run: pnpm install --frozen-lockfile --ignore-scripts

      # Generates .nuxt: the types typecheck reads and the ESLint config.
      # Without NUXT_PUBLIC_ODOO_BASE_URL the route generators skip Odoo.
      - run: pnpm exec nuxi prepare

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm exec nuxi typecheck

      - name: Unit tests
        run: pnpm test
